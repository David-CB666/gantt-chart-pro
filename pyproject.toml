[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gantt-chart-pro"
version = "1.0.0"
description = "Professional Gantt Chart generator for MS Project schedules via Excel. Dual-calendar, WBS, milestones, multi-color themes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "David-CB666" }]
keywords = ["gantt", "chart", "ms-project", "excel", "openpyxl", "scheduling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openpyxl>=3.1.0",
]

[project.scripts]
gantt-chart-pro = "scripts.gantt_chart_pro:main"
